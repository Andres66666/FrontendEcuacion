<section class="layout">
  <nav class="navbar navbar-expand-md header">
    <div class="container-fluid mx-2 flex-nowrap gap-2 gap-md-3">
      <!-- BOTÓN SIDEBAR -->
      <button
        class="toggle-button btn border-0 shadow-sm"
        (click)="toggleSidebar()"
      >
        <i
          class="bi"
          [ngClass]="isSidebarOpen ? 'bi-text-indent-right' : 'bi-list'"
        ></i>
      </button>

      <!-- LOGO (oculto en móviles pequeños) -->

      <img
        src="https://res.cloudinary.com/dsbgmboh1/image/upload/v1781144492/logoPNG_s8wars.png"
        alt="Logo"
        class="logo-navbar d-none d-sm-block"
      />

      <!-- ACCIONES DERECHA -->
      <div class="ms-auto d-flex align-items-center gap-2 gap-md-3">
        <!-- SERVICIOS -->
        <button
          class="toggle-button btn border-0 shadow-sm"
          title="Servicios"
          (click)="verServicios()"
        >
          <i class="bi bi-gear-fill"></i>
        </button>

        <!-- NOTIFICACIONES -->
        <div class="position-relative" #notificacionesContainer>
          <button
            class="toggle-button btn border-0 shadow-sm"
            title="Notificaciones"
            (click)="toggleNotificaciones($event)"
          >
            <i class="bi bi-bell-fill"></i>

            <span *ngIf="notificaciones.length > 0" class="badge-notif">
              {{ notificaciones.length }}
            </span>
          </button>

          <div
            *ngIf="mostrarNotificaciones"
            class="dropdown-menu dropdown-menu-end show notif-dropdown"
          >
            <h6 class="dropdown-header">Usuarios Desactivados</h6>

            <div class="notif-list">
              <a
                *ngFor="let notif of notificaciones"
                class="dropdown-item"
                (click)="verNotificacion(notif)"
              >
                <div class="fw-bold">{{ notif.nombre }}</div>
                <small>{{ notif.correo }}</small>
              </a>
            </div>
          </div>
        </div>

        <!-- DÍAS (ocultar en móvil pequeño) -->
        <div
          class="d-none d-md-flex align-items-center gap-1"
          *ngIf="diasTranscurridos !== null"
        >
          <i class="bi bi-hourglass-split"></i>
          <span>Día: {{ diasTranscurridos }}</span>
        </div>

        <!-- USUARIO -->
        <div class="dropdown">
          <button
            class="btn dropdown-toggle d-flex align-items-center border-0"
            data-bs-toggle="dropdown"
          >
            <img *ngIf="imagenUrl" [src]="imagenUrl" class="avatar" />

            <!-- SOLO EN DESKTOP -->
            <div class="user-info d-none d-lg-flex">
              <span>{{ userName }}</span>
              <small>{{ userRole }}</small>
            </div>
          </button>

          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <a class="dropdown-item" (click)="verPerfil()">Mi Perfil</a>
            </li>
            <li><hr /></li>
            <li>
              <a
                class="dropdown-item text-danger"
                (click)="onSelectChange('cerrarSesion')"
              >
                Cerrar Sesión
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>
  <aside
    class="leftSide aside-dark bg-white"
    [class.sidebar-open]="isSidebarOpen"
    [class.sidebar-closed]="!isSidebarOpen"
  >
    <ul class="list-group">
      <li
        class="d-flex align-items-center p-3 rounded pointer"
        *ngIf="puedeVer('GestionDeUsuarios')"
        (click)="toggleSection('GestióndeUsuarios')"
        [title]="!isSidebarOpen ? 'Gestión de Usuarios' : ''"
      >
        <div style="flex-shrink: 0" class="mx-auto mx-md-0">
          <i class="bi bi-person-gear"></i>
        </div>
        <div class="flex-grow-1 text-start ms-3" *ngIf="isSidebarOpen">
          <span class="text-dark fw-medium">Gestión de Usuarios</span>
        </div>
        <i
          *ngIf="isSidebarOpen"
          class="bi text-dark small"
          [ngClass]="
            isActive('GestióndeUsuarios')
              ? 'bi-chevron-down'
              : 'bi-chevron-right'
          "
        ></i>
      </li>

      <ul
        class="list-group ps-3 mt-1"
        *ngIf="isActive('GestióndeUsuarios') && isSidebarOpen"
      >
        <li
          class="d-flex align-items-center p-2 rounded pointer sub-menu-item"
          *ngIf="puedeVer('ListarRoles')"
          (click)="navegarYRegresar('/panel-control/listar-rol')"
        >
          <i class="bi bi-people me-2"></i>
          <span class="text-dark">Rol</span>
        </li>

        <li
          class="d-flex align-items-center p-2 rounded pointer sub-menu-item"
          *ngIf="puedeVer('ListarPermisos')"
          (click)="navegarYRegresar('/panel-control/listar-permiso')"
        >
          <i class="bi bi-shield-lock me-2"></i>
          <span class="text-dark">Permiso</span>
        </li>

        <li
          class="d-flex align-items-center p-2 rounded pointer sub-menu-item"
          *ngIf="puedeVer('ListarUsuarios')"
          (click)="navegarYRegresar('/panel-control/listar-usuario')"
        >
          <i class="bi bi-person-lines-fill me-2"></i>
          <span class="text-dark">Usuarios</span>
        </li>

        <li
          class="d-flex align-items-center p-2 rounded pointer sub-menu-item"
          *ngIf="puedeVer('ListarUsuarioRol')"
          (click)="navegarYRegresar('/panel-control/listar-usuario-rol')"
        >
          <i class="bi bi-person-gear me-2"></i>
          <span class="text-dark">Usuario Rol</span>
        </li>

        <li
          class="d-flex align-items-center p-2 rounded pointer sub-menu-item"
          *ngIf="puedeVer('ListarRolPermiso')"
          (click)="navegarYRegresar('/panel-control/listar-rol-permiso')"
        >
          <i class="bi bi-key-fill me-2"></i>
          <span class="text-dark">Rol Permiso</span>
        </li>
      </ul>

      <li
        class="d-flex align-items-center p-3 rounded mt-2 pointer"
        *ngIf="puedeVer('Operaciones')"
        (click)="toggleSection('Operaciones')"
        [title]="!isSidebarOpen ? 'Operaciones' : ''"
      >
        <div style="flex-shrink: 0" class="mx-auto mx-md-0">
          <i class="bi bi-gear"></i>
        </div>
        <div class="flex-grow-1 text-start ms-3" *ngIf="isSidebarOpen">
          <span class="text-dark fw-medium">Operaciones</span>
        </div>
        <i
          *ngIf="isSidebarOpen"
          class="bi text-dark small"
          [ngClass]="
            isActive('Operaciones') ? 'bi-chevron-down' : 'bi-chevron-right'
          "
        ></i>
      </li>

      <ul
        class="list-group ps-3 mt-1"
        *ngIf="isActive('Operaciones') && isSidebarOpen"
      >
        <li
          class="d-flex align-items-center p-2 rounded pointer sub-menu-item"
          (click)="navegarYRegresar('/panel-control/proyectos')"
        >
          <i class="bi bi-cash-stack me-2"></i>
          <span class="text-dark">Gastos Operaciones</span>
        </li>
      </ul>
    </ul>
  </aside>
  <main
    class="main-content"
    [class.content-shifted]="isSidebarOpen"
    (click)="
      !isSidebarOpen ? null : (isSidebarOpen = false); activeSection = null
    "
  >
    <div class="content-card">
      <router-outlet></router-outlet>
    </div>
  </main>
</section>
<app-confirmacion
  *ngIf="mostrarConfirmacion"
  [mensaje]="mensajeConfirmacion"
  (aceptar)="manejarAceptar()"
  (cancelar)="manejarCancelar()"
></app-confirmacion>
