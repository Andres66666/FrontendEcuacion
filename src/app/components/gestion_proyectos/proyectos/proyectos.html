<div class="container-fluid mt-5 pt-4 px-2 px-md-4">
  <!-- TÍTULO -->
  <h2 class="mb-4 text-center fw-bold text-uppercase text-dark">
    Gestión de Proyectos
  </h2>

  <!-- PROGRESO DUPLICACIÓN -->
  <div *ngIf="duplicandoProyecto" class="mb-4">
    <div class="progress">
      <div
        class="progress-bar progress-bar-striped progress-bar-animated bg-primary"
        role="progressbar"
        [style.width.%]="progresoDuplicacion"
      ></div>
    </div>
    <p class="text-center small mt-1 text-primary fw-bold">
      Duplicando: {{ progresoDuplicacion }}%
    </p>
  </div>

  <!-- TOOLBAR COMPLETAMENTE CENTRADO -->
  <div class="mb-4 overflow-visible">
    <div
      class="card-body d-flex flex-column flex-lg-row justify-content-center align-items-center gap-3 w-100"
    >
      <!-- DROPDOWN -->
      <div class="dropdown w-100 w-lg-50 mx-lg-2">
        <button
          class="btn btn-outline-success dropdown-toggle w-100 text-truncate"
          type="button"
          id="dropdownProyectos"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          title="{{ proyectoSeleccionado?.NombreProyecto || 'Seleccionar Proyecto' }}"
        >
          {{ proyectoSeleccionado?.NombreProyecto || 'Seleccionar Proyecto' }}
        </button>

        <ul class="dropdown-menu w-100 position-absolute z-3">
          <li class="px-3 py-2 border-bottom">
            <input
              type="text"
              class="form-control form-control-sm"
              placeholder="Buscar proyecto..."
              [(ngModel)]="filtroProyecto"
              (input)="filtrarProyectos()"
            />
          </li>

          <li *ngFor="let proyecto of proyectosFiltrados">
            <a
              class="dropdown-item text-truncate"
              (click)="seleccionarProyecto(proyecto)"
              title="{{ proyecto.NombreProyecto }}"
            >
              {{ proyecto.NombreProyecto }}
            </a>
          </li>

          <li *ngIf="proyectosFiltrados.length === 0">
            <span class="dropdown-item text-muted text-center">
              No hay resultados.
            </span>
          </li>
        </ul>
      </div>

      <!-- BOTONES + MODULO -->
      <div
        class="d-flex flex-wrap justify-content-center align-items-center gap-2 mx-lg-2"
      >
        <!-- NUEVO -->
        <button
          class="btn btn-outline-success btn-sm d-flex align-items-center gap-1"
          (click)="abrirNuevo()"
        >
          <i class="bi bi-plus-lg"></i>
          <span class="d-none d-sm-inline">Nuevo</span>
        </button>

        <ng-container *ngIf="proyectoSeleccionado">
          <!-- EDITAR -->
          <button
            class="btn btn-outline-warning btn-sm d-flex align-items-center gap-1"
            (click)="abrirEditar(proyectoSeleccionado)"
          >
            <i class="bi bi-pencil"></i>
            <span class="d-none d-sm-inline">Editar</span>
          </button>

          <!-- DUPLICAR -->
          <button
            class="btn btn-outline-primary btn-sm d-flex align-items-center gap-1"
            (click)="duplicarProyecto(proyectoSeleccionado, $event)"
          >
            <i class="bi bi-copy"></i>
            <span class="d-none d-sm-inline">Duplicar</span>
          </button>

          <!-- ELIMINAR -->
          <button
            class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1"
            (click)="confirmarEliminar(proyectoSeleccionado.id_proyecto)"
          >
            <i class="bi bi-trash"></i>
            <span class="d-none d-sm-inline">Eliminar</span>
          </button>

          <!-- MODULO (MISMO TAMAÑO QUE BOTÓN) -->
          <div class="d-flex align-items-center">
            <div
              class="d-flex align-items-center justify-content-center btn-sm p-0"
              style="min-width: 90px"
            >
              <app-modulo
                *ngIf="proyectoSeleccionado"
                [idProyecto]="proyectoSeleccionado.id_proyecto"
                class="w-100 h-100"
              >
              </app-modulo>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>

  <!-- CONTENIDO -->
  <div class="row" *ngIf="proyectoSeleccionado">
    <div class="col-12">
      <!-- CONTENIDO -->

      <app-items-gasto-operacion
        [idProyecto]="proyectoSeleccionado.id_proyecto"
      ></app-items-gasto-operacion>
    </div>
  </div>
</div>

<!-- MODAL NUEVO / EDITAR PROYECTO -->
<div
  class="modal fade show d-block"
  tabindex="-1"
  *ngIf="mostrarModal"
  style="background: rgba(0, 0, 0, 0.5)"
>
  <div
    class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg"
  >
    <div class="modal-content">
      <!-- HEADER -->
      <div class="modal-header">
        <h5 class="modal-title w-100 text-center">
          {{ modoEdicion ? 'Editar Proyecto' : 'Nuevo Proyecto' }}
        </h5>
        <button
          type="button"
          class="btn-close"
          (click)="cerrarModal()"
        ></button>
      </div>

      <!-- BODY -->
      <div class="modal-body">
        <form class="row g-3">
          <div class="col-12">
            <label class="form-label">Nombre Proyecto</label>
            <input
              name="NombreProyecto"
              class="form-control text-uppercase"
              [(ngModel)]="proyectoForm.NombreProyecto"
              (ngModelChange)="upperNombre()"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Carga Social</label>
            <input
              name="CargaSocial"
              type="number"
              class="form-control"
              [(ngModel)]="proyectoForm.carga_social"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">IVA Efectiva</label>
            <input
              name="IvaEfectiva"
              type="number"
              class="form-control"
              [(ngModel)]="proyectoForm.iva_efectiva"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Herramientas</label>
            <input
              name="Herramientas"
              type="number"
              class="form-control"
              [(ngModel)]="proyectoForm.herramientas"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Gastos Generales</label>
            <input
              name="GastosGenerales"
              type="number"
              class="form-control"
              [(ngModel)]="proyectoForm.gastos_generales"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">IVA Tasa Nominal</label>
            <input
              name="IvaTasaNominal"
              type="number"
              class="form-control"
              [(ngModel)]="proyectoForm.iva_tasa_nominal"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">IT</label>
            <input
              name="IT"
              type="number"
              class="form-control"
              [(ngModel)]="proyectoForm.it"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">IUE</label>
            <input
              name="IUE"
              type="number"
              class="form-control"
              [(ngModel)]="proyectoForm.iue"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Ganancia</label>
            <input
              name="Ganancia"
              type="number"
              class="form-control"
              [(ngModel)]="proyectoForm.ganancia"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Margen de Utilidad</label>
            <input
              name="MargenUtilidad"
              type="number"
              class="form-control"
              [(ngModel)]="proyectoForm.margen_utilidad"
            />
          </div>
        </form>
      </div>

      <!-- FOOTER -->
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="cerrarModal()">
          Cancelar
        </button>
        <button class="btn btn-success" (click)="guardar()">Guardar</button>
      </div>
    </div>
  </div>
</div>
<!-- Modales -->
<app-ok
  *ngIf="mensajeExito"
  [mensaje]="mensajeExito"
  (close)="manejarOk()"
></app-ok>
<app-error
  *ngIf="mensajeError"
  [mensaje]="mensajeError"
  (close)="manejarError()"
></app-error>
<app-advertencia
  *ngIf="mensajeAdvertencia"
  [mensaje]="mensajeAdvertencia"
  (close)="manejarAdvertencia()"
></app-advertencia>
<app-confirmacion
  *ngIf="mostrarConfirmacion"
  [mensaje]="mensajeConfirmacion"
  (aceptar)="accionConfirmada()"
  (cancelar)="mostrarConfirmacion = false"
>
</app-confirmacion>
