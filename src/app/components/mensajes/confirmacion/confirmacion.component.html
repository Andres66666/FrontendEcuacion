<div
  class="modal-backdrop fade show shadow"
  style="backdrop-filter: blur(4px)"
></div>

<div class="modal d-block animate-fade-in" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <div class="modal-body p-5 text-center">
        <div
          class="d-inline-flex align-items-center justify-content-center bg-primary-subtle rounded-circle mb-4"
          style="width: 85px; height: 85px"
        >
          <i
            class="bi bi-question-circle-fill text-primary"
            style="font-size: 3rem"
          ></i>
        </div>

        <h4 class="fw-bold text-dark mb-2">¿Estás seguro?</h4>
        <p
          class="text-muted mb-4 px-3"
          style="font-size: 1rem; line-height: 1.5"
        >
          {{
            mensaje ||
              "¿Deseas realizar esta acción? Esta operación podría ser irreversible."
          }}
        </p>

        <div class="d-flex gap-3 justify-content-center">
          <button
            type="button"
            class="btn py-3 fw-bold text-secondary w-100 shadow-sm border-0"
            style="
              background-color: #f1f5f9;
              border-radius: 12px;
              transition: all 0.3s ease;
            "
            onmouseover="this.style.backgroundColor = '#e2e8f0'"
            onmouseout="this.style.backgroundColor = '#f1f5f9'"
            (click)="manejarCancelar()"
          >
            Cancelar
          </button>

          <button
            type="button"
            class="btn py-3 fw-bold text-white w-100 shadow-sm border-0"
            style="
              background-color: #2563eb;
              border-radius: 12px;
              transition: all 0.3s ease;
            "
            onmouseover="
              this.style.backgroundColor = '#1d4ed8';
              this.style.transform = 'translateY(-2px)';
            "
            onmouseout="
              this.style.backgroundColor = '#2563eb';
              this.style.transform = 'translateY(0)';
            "
            (click)="manejarAceptar()"
          >
            Confirmar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
