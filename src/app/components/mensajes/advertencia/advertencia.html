<div
  class="modal-backdrop fade show shadow"
  style="backdrop-filter: blur(4px)"
></div>

<div class="modal d-block animate-fade-in" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <div class="modal-body p-5 text-center">
        <div
          class="d-inline-flex align-items-center justify-content-center bg-warning-subtle rounded-circle mb-4"
          style="width: 85px; height: 85px"
        >
          <i
            class="bi bi-exclamation-circle-fill text-warning"
            style="font-size: 3rem"
          ></i>
        </div>

        <h4 class="fw-bold text-dark mb-2">Advertencia</h4>
        <p
          class="text-muted mb-4 px-3"
          style="font-size: 1rem; line-height: 1.5"
        >
          {{ mensaje || "Por favor, revise la información antes de continuar."
          }}
        </p>

        <div class="d-grid">
          <button
            type="button"
            class="btn py-3 fw-bold text-dark shadow-sm border-0"
            style="
              background-color: #f59e0b;
              border-radius: 12px;
              transition: all 0.3s ease;
            "
            onmouseover="
              this.style.backgroundColor = '#d97706';
              this.style.transform = 'translateY(-2px)';
            "
            onmouseout="
              this.style.backgroundColor = '#f59e0b';
              this.style.transform = 'translateY(0)';
            "
            (click)="manejarCerrar()"
          >
            <i class="bi bi-check-circle me-2"></i>Entendido
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
